name: CI

on:
  pull_request:
  push:
    branches: [main, typescript-migration]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify committed dist is up to date
        run: |
          if ! git diff --exit-code -- '**/dist/**'; then
            echo "::error::dist output is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
